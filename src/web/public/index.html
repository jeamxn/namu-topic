<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무위키 실시간 검색어 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script>
    // FOUC 방지: 첫 페인트 전에 .dark 클래스 적용
    (function () {
      try {
        var m = localStorage.getItem('namu-topic-theme') || 'system';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>
  <style>
    * {
      font-family: 'Noto Sans KR', sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>

<body class="min-h-screen">
  <div id="root"></div>
  <script type="module" src="../frontend/main.tsx"></script>
</body>

</html>
